# linkedin-scheduler settings. Only the post cards use them; publishing needs nothing here.

[card]
# Bottom line of every card: "Name - role" (the name is bold). A post can override it with card_sign.
signature = "Your Name - Backend Developer"
# Colours of the cards (any CSS colour).
accent = "#F24822"
paper = "#FAF8F5"
ink = "#151515"
muted = "#3F3C38"
rule = "#E8E2DA"
# Optional: your own mark (square SVG or PNG), shown in the top-right corner. Path relative to this file.
mark = ""

[browser]
# Optional: path to Chrome or Chromium. Empty: Playwright looks for an installed Google Chrome.
chrome = ""
